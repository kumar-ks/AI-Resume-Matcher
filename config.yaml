# ─────────────────────────────────────────────────────────────────────────────
# AI Resume Matcher — Configuration File
# ─────────────────────────────────────────────────────────────────────────────
# All settings can be overridden via CLI flags (CLI takes priority over config).
# Priority: CLI flags > config.yaml > built-in defaults
# ─────────────────────────────────────────────────────────────────────────────

# ── LLM Model Configuration ──────────────────────────────────────────────────
# Primary model: Used first for all LLM calls.
# Failover model: Automatically used if primary fails (API error, rate limit, timeout).
#
# Supported providers via LiteLLM:
#   Local:    ollama/llama3, ollama/mistral, ollama/qwen2, ollama/llama3:70b
#   OpenAI:   gpt-4, gpt-4o, gpt-3.5-turbo
#   Anthropic: anthropic/claude-3-sonnet-20240229, anthropic/claude-3-opus-20240229
#   AWS:      bedrock/anthropic.claude-3-sonnet

#model: "anthropic/claude-3-sonnet-20240229"
#failover_model: "ollama/llama3"

# config.yaml — just set Ollama as primary
model: "ollama/llama3"
failover_model: null    # No failover needed


# ── Embedding Model ──────────────────────────────────────────────────────────
# Sentence-transformers model for semantic matching (Stage 3).
#   Fast:     all-MiniLM-L6-v2 (80MB, good balance)
#   Accurate: all-mpnet-base-v2 (420MB, better quality)
embedding_model: "all-MiniLM-L6-v2"

# ── File Paths ────────────────────────────────────────────────────────────────
resumes_dir: "./resumes"
jd_dir: "./jd"

# ── Performance ──────────────────────────────────────────────────────────────
# concurrency: Resumes processed in parallel (applies to ALL models including Ollama)
#   Ollama (local):  3-5 (depends on GPU VRAM / CPU cores)
#   Cloud APIs:      5-10 (rate limit dependent)
#   Mac M-series:    3-5 (Metal GPU handles concurrent inference well)
#   Server GPU:      5-10 (depending on VRAM)
concurrency: 3

# explain_top: Only generate AI explanations for top N candidates
#   null = explain all | 10 = recommended for 50+ resumes
explain_top: null

# ── LLM Parameters ───────────────────────────────────────────────────────────
temperature: 0.1
max_tokens: 4096

# ── Scoring Weights ──────────────────────────────────────────────────────────
# Must sum to 1.0. Adjust based on hiring criteria.
# See README.md for detailed reasoning behind each weight.
scoring_weights:
  must_have_match: 0.35       # "Can they do the job?" (hard filter)
  experience_match: 0.25      # "Are they at the right level?"
  skills_depth: 0.20          # "How deep is their expertise?"
  project_relevance: 0.12     # "Have they applied it practically?"
  recency_factor: 0.08        # "Is their experience current?"

# ── Output ────────────────────────────────────────────────────────────────────
output_file: null       # Set to "results.json" to always export
top_n: null             # Show only top N (null = show all)
debug: false            # Enable verbose logging

# ── Database & Scanner ────────────────────────────────────────────────────────
# Storage paths for the persistent resume database
db_path: "./data/profiles.db"              # SQLite profile storage
vector_store_path: "./data/chroma"         # ChromaDB embedding storage
scanned_files_path: "./data/scanned_files" # Copies of processed resumes

# ── Pipeline Execution Mode ──────────────────────────────────────────────────
# Controls how the matching pipeline is orchestrated.
#   "linear"   — Classic sequential pipeline (MatchingPipeline.match())
#   "graph"    — LangGraph state machine with checkpointing + conditional routing
# The graph mode provides crash recovery and streaming progress.
pipeline_mode: "linear"

# scan_mode controls how matching finds candidates:
#   "db_first"    — Search DB first, then scan folder for new files (DEFAULT)
#   "folder_only" — Bypass DB, scan folder directly (fresh extraction every time)
#   "db_only"     — Only use DB, never scan folder (fastest)
scan_mode: "db_first"

# ── LangChain Settings ────────────────────────────────────────────────────────
# Controls for the LangChain chain layer (prompt → LLM → PydanticOutputParser).
# These settings apply to all chain-based LLM calls (Stages 1, 2, 5).
langchain:
  # max_retries: How many times to retry if the output parser fails to parse
  #   LLM response. Each retry re-invokes the full chain (prompt + LLM + parse).
  #   0 = no retries (fail immediately), 2 = recommended for local models
  max_retries: 2

  # timeout: LLM call timeout in seconds (per attempt, not total)
  #   Ollama cold-start can take 30-60s on first call; set generously.
  timeout: 300

  # explainability_temperature: Temperature specifically for Stage 5 explanations.
  #   Slightly higher than extraction stages for more natural language.
  explainability_temperature: 0.3

# ── Bi-Frost Gateway (BT GenAI Gateway) ──────────────────────────────────────
# Routes LLM calls through BT's enterprise AI gateway for governance,
# compliance, centralized auth, and model access management.
#
# When enabled, the gateway provides:
#   - Access to enterprise-approved models (Claude, GPT-4, etc.)
#   - Centralized cost tracking and quota management
#   - Content filtering and compliance guardrails
#   - Audit trail for all AI interactions
#
# Set credentials via environment variables (see .env.example).
# If BIFROST_BASE_URL is not set, all calls go directly to litellm (local/cloud).
bifrost:
  enabled: false          # Set to true when gateway credentials are configured

  # PII routing: Which stages can send data through the gateway?
  #   "default" — JD + Explainability through gateway, Resume stays local (PII)
  #   "all"     — All stages go through gateway (only if gateway handles PII)
  #   "none"    — All stages stay local (gateway disabled for LLM calls)
  pii_routing: "default"

  # default_model: Model to request from the gateway (overrides top-level 'model')
  #   The gateway maps this to the actual provider (Anthropic/OpenAI/Bedrock)
  # default_model: "anthropic/claude-3-sonnet"

  # Metadata sent with every request for cost attribution
  # project_id: "ai-resume-matcher"
  # cost_center: ""
  # use_case: "recruitment-automation"

# ── Observability (LangFuse) ─────────────────────────────────────────────────
# LangFuse provides tracing, cost tracking, and quality monitoring for LLM calls.
# Set credentials via environment variables (see .env).
# Set enabled to false to disable tracing even if keys are present.
#
# Dashboard: https://cloud.langfuse.com (or self-hosted URL)
# Docs: https://langfuse.com/docs
langfuse:
  enabled: true           # Set to false to disable tracing
  # host: "https://cloud.langfuse.com"  # Override for self-hosted instances
