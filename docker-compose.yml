version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_matcher_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: matcher_secret
      POSTGRES_DB: resume_matcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher -d resume_matcher"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
